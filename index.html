<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Human</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0c08; overflow: hidden; }
  body { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: #d9d4b4; user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  #menu { background: radial-gradient(ellipse at center, rgba(8,9,5,0.35) 0%, rgba(8,9,5,0.85) 75%); }
  h1 { margin: 0; font-size: clamp(40px, 7vw, 84px); letter-spacing: 0.18em; color: #e6e0bd; text-shadow: 4px 4px 0 #000, 0 0 24px rgba(0,0,0,0.6); font-weight: 800; }
  .tag { margin-top: -14px; font-size: 13px; letter-spacing: 0.35em; color: #9c9774; text-transform: uppercase; text-shadow: 2px 2px 0 #000; }
  #slots { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .slot { width: 240px; padding: 16px; background: rgba(16,17,11,0.92); border: 2px solid #4a4935; box-shadow: 4px 4px 0 #000; display: flex; flex-direction: column; gap: 8px; }
  .slot.empty { border-style: dashed; border-color: #3a392a; }
  .slot-title { font-weight: 700; font-size: 15px; color: #e6e0bd; }
  .slot-info { font-size: 12px; color: #9c9774; min-height: 30px; }
  .slot-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .warn { font-size: 12px; color: #e0a24f; width: 100%; }
  button { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px; cursor: pointer; color: #15160e; background: #c9c08a; border: 2px solid #000; box-shadow: 3px 3px 0 #000; }
  button:hover { background: #e6dca0; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  button.ghost { background: transparent; color: #9c9774; border-color: #4a4935; box-shadow: none; }
  button.ghost:hover { color: #e6e0bd; border-color: #9c9774; }
  button.danger { background: #b5473c; color: #fff; }
  .panel { background: rgba(16,17,11,0.94); border: 2px solid #4a4935; box-shadow: 6px 6px 0 #000; padding: 28px 34px; display: flex; flex-direction: column; gap: 12px; min-width: 260px; text-align: center; }
  .panel h2 { margin: 0 0 6px; letter-spacing: 0.2em; font-size: 22px; }
  #pause, #dead { background: rgba(5,6,3,0.6); }
  #dead { background: rgba(30,2,1,0.55); }
  #dead h2 { color: #e05a4f; font-size: 34px; text-shadow: 3px 3px 0 #000; }
  #dead .panel { animation: rise 0.8s ease-out; border-color: #6e2620; }
  .dead-note { font-size: 12px; color: #9c9774; max-width: 280px; margin: 4px auto 6px; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  #hint { position: fixed; left: 14px; bottom: 12px; font-size: 12px; color: #d9d4b4; text-shadow: 1px 1px 0 #000, 0 0 6px #000; transition: opacity 2s; line-height: 1.7; }
  #hint.fade { opacity: 0; }
  #hint b, #maphelp b { color: #e8c547; }
  #maphelp { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; font-size: 12px; background: rgba(16,17,11,0.9); border: 2px solid #4a4935; padding: 8px 14px; display: flex; gap: 14px; align-items: center; white-space: nowrap; }
  #mapcolor { display: inline-block; width: 12px; height: 12px; border: 2px solid #000; vertical-align: middle; }
  #maptitle { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); font-size: 14px; letter-spacing: 0.3em; color: #9c9774; }
  #debug { position: fixed; top: 8px; left: 10px; font-size: 11px; color: #fff; text-shadow: 1px 1px 0 #000; }
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 16px; background: rgba(16,17,11,0.94); border: 2px solid #4a4935; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; letter-spacing: 0.3em; color: #9c9774; }
  .foot { position: fixed; bottom: 12px; font-size: 11px; color: #6b6a4e; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading">LOADING…</div>

<div id="menu" class="screen hidden">
  <h1>STILL HUMAN</h1>
  <div class="tag">Every world is new. Every death is final.</div>
  <div id="slots"></div>
  <div class="foot">Build 2026-11-07 21:10</div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <button id="btn-resume">Resume</button>
    <button id="btn-save">Save</button>
    <button id="btn-quit" class="ghost">Save &amp; quit to menu</button>
  </div>
</div>

<div id="dead" class="screen hidden">
  <div class="panel">
    <h2>GAME OVER</h2>
    <div id="dead-cause"></div>
    <div id="dead-time"></div>
    <div class="dead-note">This survivor is gone for good. Their save has been deleted.</div>
    <button id="btn-dead-menu">Main menu</button>
  </div>
</div>

<div id="hint" class="hidden"><b>WASD</b> move · <b>Shift</b> run · <b>M</b> map · <b>Esc</b> pause</div>

<div id="maphelp" class="hidden">
  <span><b>Drag</b> pan</span><span><b>Wheel</b> zoom</span>
  <span><b>Click</b> add marker <span id="mapcolor"></span> <b>1–4</b> colour</span>
  <span><b>Right-click</b> remove</span><span><b>C</b> centre</span><span><b>M</b> close</span>
</div>

<div id="debug" class="hidden"></div>
<div id="toast"></div>

<script>
// ============================================================================
// Still Human — world generation
// Pure logic (no canvas), so it can be tested outside the browser.
// The world is infinite and split into chunks of CHUNK x CHUNK tiles.
// Every chunk is generated from the world's hidden seed, so a chunk that is
// unloaded and generated again comes out exactly the same.
// ============================================================================

const TILE = 32;            // pixels per tile
const CHUNK = 16;           // tiles per chunk side
const CPX = TILE * CHUNK;   // pixels per chunk side

const T_GRASS = 0, T_DRY = 1, T_DIRT = 2, T_WATER = 3;

// Edge index for autotiled water / dirt:
//   0..8  = 3x3 block (row*3 + col), 4 = open center
//   9..12 = inside corners (land at NW, NE, SW, SE)
const EDGE_NONE = 255, EDGE_CENTER = 4;

// ---- Tuning ---------------------------------------------------------------
const GEN = {
  lakeScale: 85, lakeThreshold: 0.31,
  riverScale: 320, riverWidth: 0.011, riverWarp: 45,
  fordScale: 24, fordThreshold: 0.34,      // natural land crossings in rivers
  dirtScale: 22, dirtThreshold: 0.33,
  dryScale: 55, dryThreshold: 0.2,
  denseScale: 9, denseThreshold: 0.12,
  forestScale: 65,
};

// ---- Object kinds -----------------------------------------------------------
// sx,sy,sw,sh: source rect in objects sheet. ax,ay: base point inside sprite.
// cw,ch: collider size (centered on base, extending up). 0 = walk through.
// rx,ry: shadow ellipse radii.  tall: fades when the player walks behind.
const KINDS = [
  { name: 'oak',     sx: 0,   sy: 0,   sw: 64, sh: 96, ax: 32, ay: 95, cw: 12, ch: 7,  rx: 20, ry: 6, tall: true },
  { name: 'pine',    sx: 64,  sy: 0,   sw: 64, sh: 96, ax: 31, ay: 95, cw: 10, ch: 7,  rx: 17, ry: 5, tall: true },
  { name: 'dead',    sx: 128, sy: 0,   sw: 64, sh: 96, ax: 33, ay: 95, cw: 12, ch: 7,  rx: 15, ry: 5, tall: true },
  { name: 'bush1',   sx: 0,   sy: 96,  sw: 32, sh: 32, ax: 16, ay: 28, cw: 0,  ch: 0,  rx: 13, ry: 4 },
  { name: 'bush2',   sx: 32,  sy: 96,  sw: 32, sh: 32, ax: 16, ay: 28, cw: 0,  ch: 0,  rx: 13, ry: 4 },
  { name: 'bush3',   sx: 64,  sy: 96,  sw: 32, sh: 32, ax: 16, ay: 28, cw: 0,  ch: 0,  rx: 12, ry: 3 },
  { name: 'rock',    sx: 96,  sy: 96,  sw: 32, sh: 32, ax: 16, ay: 28, cw: 22, ch: 9,  rx: 12, ry: 4 },
  { name: 'stump',   sx: 128, sy: 96,  sw: 32, sh: 32, ax: 16, ay: 28, cw: 18, ch: 9,  rx: 13, ry: 4 },
  { name: 'tall',    sx: 160, sy: 96,  sw: 32, sh: 32, ax: 16, ay: 28, cw: 0,  ch: 0,  rx: 0,  ry: 0 },
  { name: 'log',     sx: 64,  sy: 128, sw: 64, sh: 32, ax: 32, ay: 28, cw: 56, ch: 11, rx: 28, ry: 4 },
  { name: 'boulder', sx: 0,   sy: 128, sw: 64, sh: 64, ax: 32, ay: 60, cw: 54, ch: 20, rx: 29, ry: 7, tall: true },
];
const K = Object.fromEntries(KINDS.map((k, i) => [k.name, i]));

// ---- Hashing & noise ----------------------------------------------------------
function hashInt(x, y, s) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
function hash01(x, y, s) { return hashInt(x, y, s) / 4294967296; }

const GRAD_X = [1, -1, 1, -1, 1.4142, -1.4142, 0, 0];
const GRAD_Y = [1, 1, -1, -1, 0, 0, 1.4142, -1.4142];
// Gradient noise that never repeats (gradients come from a hash, not a table).
function makeNoise(seed) {
  return function (x, y) {
    const X = Math.floor(x), Y = Math.floor(y);
    const xf = x - X, yf = y - Y;
    const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10);
    const v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
    const g = (ix, iy, dx, dy) => { const h = hashInt(ix, iy, seed) & 7; return GRAD_X[h] * dx + GRAD_Y[h] * dy; };
    const a = g(X, Y, xf, yf), b = g(X + 1, Y, xf - 1, yf);
    const c = g(X, Y + 1, xf, yf - 1), d = g(X + 1, Y + 1, xf - 1, yf - 1);
    const x1 = a + (b - a) * u, x2 = c + (d - c) * u;
    return x1 + (x2 - x1) * v; // roughly -1..1
  };
}
function fbm(n, x, y, oct) {
  let amp = 1, f = 1, sum = 0, tot = 0;
  for (let i = 0; i < oct; i++) { sum += amp * n(x * f, y * f); tot += amp; amp *= 0.5; f *= 2; }
  return sum / tot;
}
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

// ---- World generator -------------------------------------------------------------
class WorldGen {
  constructor(seed) {
    this.seed = seed >>> 0;
    const s = this.seed;
    this.nLake = makeNoise(s ^ 0x1111);
    this.nRiver = makeNoise(s ^ 0x2222);
    this.nWarpX = makeNoise(s ^ 0x3333);
    this.nWarpY = makeNoise(s ^ 0x4444);
    this.nFord = makeNoise(s ^ 0x5555);
    this.nDirt = makeNoise(s ^ 0x6666);
    this.nDry = makeNoise(s ^ 0x7777);
    this.nDense = makeNoise(s ^ 0x8888);
    this.nForest = makeNoise(s ^ 0x9999);
    this.nTreeType = makeNoise(s ^ 0xaaaa);
  }

  // Continuous fields for one tile.
  field(tx, ty) {
    const lake = fbm(this.nLake, tx / GEN.lakeScale, ty / GEN.lakeScale, 3);
    const wx = tx + GEN.riverWarp * this.nWarpX(tx / 110, ty / 110);
    const wy = ty + GEN.riverWarp * this.nWarpY(tx / 110, ty / 110);
    const river = Math.abs(fbm(this.nRiver, wx / GEN.riverScale, wy / GEN.riverScale, 2));
    const ford = this.nFord(tx / GEN.fordScale, ty / GEN.fordScale);
    const isWater = lake > GEN.lakeThreshold || (river < GEN.riverWidth && ford < GEN.fordThreshold);
    // How far (in field units) we are from any water — used to keep dirt and
    // dry ground away from shores, where the edge tiles have green grass.
    const nearWater = lake > GEN.lakeThreshold - 0.1 || river < GEN.riverWidth * 2.6;
    const dry = fbm(this.nDry, tx / GEN.dryScale, ty / GEN.dryScale, 2) + (hash01(tx, ty, this.seed ^ 0x51) - 0.5) * 0.1;
    const isDry = !nearWater && dry > GEN.dryThreshold;
    const dirt = fbm(this.nDirt, tx / GEN.dirtScale, ty / GEN.dirtScale, 2);
    const isDirt = !nearWater && dry < GEN.dryThreshold - 0.08 && dirt > GEN.dirtThreshold;
    return { isWater, isDry, isDirt };
  }

  forest(tx, ty) {
    const f = fbm(this.nForest, tx / GEN.forestScale, ty / GEN.forestScale, 2);
    return clamp01((f - 0.02) * 3.2);
  }

  // Generate one chunk's data. Cheap (no drawing): safe to call for the map.
  genChunk(cx, cy) {
    const P = 2, S = CHUNK + P * 2;
    const ox = cx * CHUNK - P, oy = cy * CHUNK - P;
    const rawW = new Uint8Array(S * S), rawD = new Uint8Array(S * S), dry = new Uint8Array(S * S);
    for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
      const f = this.field(ox + i, oy + j);
      const k = j * S + i;
      rawW[k] = f.isWater ? 1 : 0;
      rawD[k] = f.isDirt ? 1 : 0;
      dry[k] = f.isDry ? 1 : 0;
    }
    // "Opening": keep only cells that are part of a full 2x2 block. This
    // removes 1-tile-wide strips, which the 13-piece edge sets can't draw.
    const open = (raw) => {
      const out = new Uint8Array(S * S);
      const r = (i, j) => raw[j * S + i];
      for (let j = 1; j < S - 1; j++) for (let i = 1; i < S - 1; i++) {
        if (!r(i, j)) continue;
        if ((r(i - 1, j) && r(i, j - 1) && r(i - 1, j - 1)) ||
            (r(i + 1, j) && r(i, j - 1) && r(i + 1, j - 1)) ||
            (r(i - 1, j) && r(i, j + 1) && r(i - 1, j + 1)) ||
            (r(i + 1, j) && r(i, j + 1) && r(i + 1, j + 1))) out[j * S + i] = 1;
      }
      return out;
    };
    const W = open(rawW), D = open(rawD);
    const edgeOf = (M, i, j) => {
      const m = (a, b) => M[b * S + a];
      const n = m(i, j - 1), s = m(i, j + 1), w = m(i - 1, j), e = m(i + 1, j);
      const col = !w ? 0 : !e ? 2 : 1;
      const row = !n ? 0 : !s ? 2 : 1;
      if (col === 1 && row === 1) {

// ---- World rendering ---------------------------------------------------------------------------
let frameTime = 0;

  bctx.fill();
}
function renderWorld(camX, camY, withPlayer) {
  const frame = Math.floor(frameTime / 450) % 4;

  bctx.fillStyle = waterPatterns[frame];
  bctx.fillRect(camX, camY, BW, BH);

  const cx0 = Math.floor(camX / CPX), cy0 = Math.floor(camY / CPX);

  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++)
    bctx.drawImage(getChunkCanvas(cx, cy, true), cx * CPX, cy * CPX);
  // Pre-build one chunk canvas just outside the view each frame, so walking stays smooth.
  outer: for (let cy = cy0 - 1; cy <= cy1 + 1; cy++) for (let cx = cx0 - 1; cx <= cx1 + 1; cx++)
    if (!canvasCache.has(ck(cx, cy))) { getChunkCanvas(cx, cy, true); break outer; }

  // Objects in view (tall sprites reach up from chunks below the view).
  const items = [];
  for (let cy = cy0; cy <= cy1 + 1; cy++) for (let cx = cx0 - 1; cx <= cx1 + 1; cx++) {
    for (const o of getData(cx, cy).objects) {
      const k = KINDS[o.k], sx = o.x - k.ax, sy = o.y - k.ay;
      if (sx + k.sw < camX || sx > camX + BW || sy + k.sh < camY || sy > camY + BH + 8) continue;
      items.push(o);

  }
  if (withPlayer) {
    items.push({ k: -1, x: player.x, y: player.y });
    for (const z of zombies) {
      if (z.x < camX - 40 || z.x > camX + BW + 40 || z.y < camY - 8 || z.y > camY + BH + 64) continue;
      items.push({ k: -2, x: z.x, y: z.y, z });
    }
  }
  items.sort((a, b) => a.y - b.y);

  bctx.fillStyle = 'rgba(16, 20, 8, 0.32)';
  for (const o of items) {
    if (o.k < 0) drawShadow(o.x, o.y, 9, 3);
    else { const k = KINDS[o.k]; drawShadow(o.x, o.y, k.rx, k.ry); }
  }

  const pbx0 = withPlayer ? player.x - 11 : 0, pby0 = withPlayer ? player.y - 46 : 0;
  for (const o of items) {
    if (o.k === -1) {
      const [fx, fy] = playerFrame(player);
      bctx.drawImage(IMG.player, fx * PF, fy * PF, PF, PF, Math.round(o.x - P_AX), Math.round(o.y - P_AY), PF, PF);
      continue;
    }
    if (o.k === -2) {

      if (o.z.mode === 'attack' && o.z.atk < 0.15) { const v = { N: [0, -3], S: [0, 3], E: [3, 0], W: [-3, 0] }[o.z.dir]; lx = v[0]; ly = v[1]; }
      bctx.drawImage(IMG[ZOMBIE_TYPES[o.z.type].img], fx * PF, fy * PF, PF, PF, Math.round(o.x - P_AX + lx), Math.round(o.y - P_AY + ly), PF, PF);
      continue;
    }
    const k = KINDS[o.k], sx = o.x - k.ax, sy = o.y - k.ay;
    let fade = false;
    if (withPlayer && k.tall && player.y < o.y &&
        rectsHit(pbx0, pby0, pbx0 + 22, player.y, sx + 4, sy, sx + k.sw - 4, o.y - k.ch)) fade = true;
    if (fade) bctx.globalAlpha = 0.45;
    bctx.drawImage(IMG.objects, k.sx, k.sy, k.sw, k.sh, sx, sy, k.sw, k.sh);
    if (fade) bctx.globalAlpha = 1;

// ---- Health bar & hurt overlay ---------------------------------------------------------------
const HEART = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
function renderHealthBar() {
  const x = 6, y = 7, hp = player.hp;

  // Heart icon with a black outline.

    HEART.forEach((row, r) => { for (let c = 0; c < 7; c++) if (row[c] === '#') bctx.fillRect(x + c + ox, y + r + oy, 1, 1); });
  HEART.forEach((row, r) => { for (let c = 0; c < 7; c++) if (row[c] === '#') {
    bctx.fillStyle = (r === 1 && (c === 1 || c === 2)) ? '#f4a090' : beat ? '#8e231c' : '#d33a2f';
    bctx.fillRect(x + c, y + r, 1, 1);

  bctx.fillStyle = 'rgba(0,0,0,0.45)';

let vignette = null;
function makeVignette() {
  vignette = document.createElement('canvas'); vignette.width = 320; vignette.height = 180;
  const g = vignette.getContext('2d');

// ---- Minimap --------------------------------------------------------------------------------------
const MM = 72; // minimap size in native pixels (1 px per tile)
const MARKER_COLORS = ['#e8c547', '#e05a4f', '#5fb0e8', '#8be06a'];

}
function drawMarker(g, x, y, c) {

function renderMinimap() {
  const x0 = BW - MM - 6, y0 = 6;

  for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
    if (!explored.has(ck(cx, cy))) continue;

function screenToMapTile(sx, sy) {

  world = new WorldGen(s.seed); resetCaches();
  player = newPlayer(s.player.x, s.player.y); player.dir = s.player.dir || 'S';
  explored = new Map(Object.entries(s.explored || {}).map(([k, v]) => [k, unpackBits(v)]));
  markers = s.markers || []; playTime = s.playTime || 0; created = s.created || Date.now();
  player.hp = s.player.hp ?? MAX_HP;
  zombies = (s.zombies || []).filter(z => ZOMBIE_TYPES[z.t]).map(z => { const o = makeZombie(z.t, z.x, z.y); o.hp = z.hp; o.dir = z.dir || 'S'; return o; });
  zSpawnT = 8;
  startPlaying();
}
function saveGame() {
  if (!player || !slot) return;
  const ex = {};
  for (const [k, v] of explored) ex[k] = packBits(v);
  store.set(slotKey(slot), JSON.stringify({
    v: 1, seed: world.seed, created, updated: Date.now(), playTime: Math.floor(playTime),
    player: { x: Math.round(player.x), y: Math.round(player.y), dir: player.dir, hp: player.hp },
    zombies: zombies.map(z => ({ t: z.type, x: Math.round(z.x), y: Math.round(z.y), hp: z.hp, dir: z.dir })),
    explored: ex, markers,
  }));
  lastAutosave = performance.now();
}
// Permadeath: the save was deleted when the player died (see startDying).
function showGameOver() {
  slot = 0; state = 'dead';
  $('dead-cause').textContent = deathCause;
  $('dead-time').textContent = 'You survived ' + fmtTime(playTime) + '.';
  ui.dead.classList.remove('hidden');
}
window.addEventListener('beforeunload', () => { if (state === 'play' || state === 'pause' || state === 'map') saveGame(); });

// ---- Main loop --------------------------------------------------------------------------------------
const menuCam = { x: 0, y: 0 };
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0, revealT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  frameTime = now;
  mapBuildBudget = 6;

  if (state === 'menu') {
    menuCam.x += dt * 22; menuCam.y += dt * 9;
    renderWorld(Math.round(menuCam.x), Math.round(menuCam.y), false);
  } else if (player) {
    if (state === 'play' || state === 'map') {
      if (state === 'play') updatePlayer(dt);
      playTime += dt;
      updateZombies(dt);
      revealT -= dt;
      if (revealT <= 0) { revealAround(player.x, player.y); revealT = 0.2; }
      if (now - lastAutosave > 120000) saveGame();
    } else if (state === 'dying') {
      for (const z of zombies) updateZombie(z, dt);
      hurtFx.deathT += dt;
      if (hurtFx.deathT > 1.6) showGameOver();
    } else if (state === 'dead') {
      hurtFx.deathT += dt;
    }
    updateHurtEffects(dt);
    if (state === 'map') renderFullMap();
    else {
      const [sx, sy] = shakeOffset();
      const camX = Math.round(player.x - BW / 2) + sx, camY = Math.round(player.y - 24 - BH / 2) + sy;
      renderWorld(camX, camY, true);
      unloadFarChunks(camX, camY);
    }
  }

  ctx.drawImage(buf, 0, 0, BW * scale, BH * scale);
  if (state !== 'menu' && state !== 'map') renderHurtOverlay();
  // HUD goes on top of the red overlay so it stays readable.
  if (player && (state === 'play' || state === 'pause')) {
    bctx.clearRect(0, 0, BW, BH);
    renderMinimap(); renderHealthBar();
    ctx.drawImage(buf, 0, 0, BW * scale, BH * scale);
  }

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0;
    if (!ui.debug.classList.contains('hidden') && player) {
      ui.debug.textContent = `${fps} fps · tile ${Math.floor(player.x / TILE)}, ${Math.floor(player.y / TILE)} · zombies ${zombies.length} · hp ${Math.ceil(player.hp)} · chunks ${canvasCache.size} drawn / ${dataCache.size} data / ${explored.size} explored`;
    }
  }
  requestAnimationFrame(loop);
}

// ---- Boot ---------------------------------------------------------------------------------------------
resize();
loadImages().then(() => {
  prepareAssets();
  ui.loading.classList.add('hidden');
  showMenu();
  requestAnimationFrame(loop);
}).catch(err => { ui.loading.textContent = 'Could not load game art: ' + err; });

// Hooks for automated testing.
window.__SH = { get state() { return state; }, get player() { return player; }, get world() { return world; }, tileAt, newGame, saveGame, loadGame, killPlayer: c => startDying(c), hurtPlayer, zombies: () => zombies,
  spawnZombie(dx, dy) { const z = makeZombie('walker', player.x + dx, player.y + dy); zombies.push(z); return z; }, openMap, closeMap, markers: () => markers, explored: () => explored, canvasCache, dataCache };
})();

</script>
